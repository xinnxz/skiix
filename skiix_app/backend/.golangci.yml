run:
  timeout: 5m
  go: '1.26'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - unconvert
    - unparam

linters-settings:
  errcheck:
    check-type-assertions: true

  gosec:
    excludes:
      - G104

  govet:
    enable-all: true

  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    - path: docs/
      linters:
        - all
    - path: pkg/migration/
      linters:
        - gosec
